<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EJE CLOUD IA</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="brand">
      <div class="seal">CM</div>
      <div class="brand-text">
        <span class="brand-main">EJE CLOUD IA</span>
        <span class="brand-sub">Magistratura CABA</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="btnOptions" title="Configuración" onclick="openOptions()">⚙</button>
      <button class="btn-icon" id="btnDocs" title="Documentos generados" onclick="toggleDocPanel()">📄</button>
    </div>
  </header>

  <!-- Panel principal -->
  <div class="app">

    <!-- Chat -->
    <div id="chatPanel" class="panel active">
      <div id="messages" class="messages"></div>

      <!-- Acciones rápidas -->
      <div class="quick-actions">
        <button class="chip" onclick="quickQuery('Leé el contenido de la página actual y explicame qué muestra')">👁 Leer página</button>
        <button class="chip" onclick="quickQuery('Extraé los datos de la tabla de la página actual')">📊 Extraer tabla</button>
        <button class="chip" onclick="quickQuery('Generá un informe con el contenido de la página actual')">📄 Generar informe</button>
      </div>

      <!-- Input -->
      <div class="input-area">
        <textarea
          id="msgInput"
          class="msg-input"
          placeholder="Preguntale algo sobre EJE CLOUD..."
          rows="2"
          onkeydown="onKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button id="sendBtn" class="btn-send" onclick="sendMessage()">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
        </button>
      </div>
      <div class="input-footer">
        <button class="link-btn" onclick="clearChat()">🗑 Limpiar</button>
        <span id="modelLabel" class="model-label"></span>
      </div>
    </div>

    <!-- Panel de documentos generados -->
    <div id="docPanel" class="panel">
      <div class="doc-panel-header">
        <h3>Documento generado</h3>
        <div class="doc-actions">
          <button class="btn-sm" onclick="printDoc()">🖨 Imprimir</button>
          <button class="btn-sm" onclick="copyDocHtml()">📋 Copiar HTML</button>
          <button class="btn-sm" onclick="toggleDocPanel()">✕ Cerrar</button>
        </div>
      </div>
      <div id="docContent" class="doc-content"></div>
    </div>

  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
